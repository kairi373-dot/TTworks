<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eef2f7">
  <title>TTworks Company HQ</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="company-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">T</div>
        <div>
          <strong>TTworks</strong>
          <span>Company HQ</span>
        </div>
      </div>

      <nav>
        <a class="active" href="#hq">🏢 本社ホーム</a>
        <a href="#departments">🏬 部署</a>
        <a href="#projects">📁 案件</a>
        <a href="#staff">🤖 AI社員</a>
        <a href="#approvals">✅ 承認待ち</a>
        <a href="#characters">🎨 キャラクター</a>
      </nav>

      <div class="owner-card">
        <span>代表</span>
        <strong>てっぺい</strong>
        <small>最終承認・契約・決済</small>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div>
          <span class="crumb">TTworks / 本社</span>
          <h1>会社ダッシュボード</h1>
        </div>
        <div class="top-actions">
          <button type="button">＋ 新規案件</button>
          <div class="company-status"><i></i> 稼働中</div>
        </div>
      </header>

      <main id="hq">
        <section class="welcome">
          <div>
            <p>GOOD AFTERNOON</p>
            <h2>TTworks、本日の業務状況</h2>
            <span>AI各部署が制作・確認・登録準備を分担して進行します。</span>
          </div>
          <div class="date-box">2026.10.02</div>
        </section>

        <section class="kpis" id="metrics"></section>

        <section class="section" id="departments">
          <div class="section-title">
            <div><span>ORGANIZATION</span><h3>部署一覧</h3></div>
            <small>案件は工程に応じて部署間を移動</small>
          </div>
          <div class="department-grid" id="departmentsGrid"></div>
        </section>

        <section class="section" id="projects">
          <div class="section-title">
            <div><span>PROJECTS</span><h3>進行中の案件</h3></div>
            <select id="projectFilter">
              <option value="all">すべて</option>
              <option value="active">進行中</option>
              <option value="review">確認待ち</option>
              <option value="ready">登録準備</option>
            </select>
          </div>
          <div class="project-table" id="projectGrid"></div>
        </section>

        <section class="split">
          <section class="section" id="staff">
            <div class="section-title">
              <div><span>STAFF</span><h3>AI社員</h3></div>
            </div>
            <div class="staff-list" id="agents"></div>
          </section>

          <section class="section" id="approvals">
            <div class="section-title">
              <div><span>APPROVAL</span><h3>社長承認待ち</h3></div>
            </div>
            <div class="approval-list" id="nextActions"></div>
          </section>
        </section>

        <section class="section" id="characters">
          <div class="section-title">
            <div><span>ASSETS</span><h3>キャラクター資産</h3></div>
          </div>
          <div class="character-grid" id="charactersGrid"></div>
        </section>
      </main>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
